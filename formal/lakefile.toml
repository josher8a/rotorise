name = "calculus"
version = "0.1.0"
defaultTargets = ["Calculus"]

[[lean_lib]]
name = "Calculus"

# mathlib, pinned to the tag matching lean-toolchain (v4.15.0). It retires the hand-rolled
# list/option plumbing that used to live in Combinators.lean; what mathlib does not supply
# is now gathered in Calculus/Lists.lean. See docs/codec-formalization.md §7.
#
# Note that mathlib proves a great deal classically, so a careless appeal widens the axiom
# base §3 advertises. Calculus/Axioms.lean is the guard that makes that a build error.
[[require]]
name = "mathlib"
scope = "leanprover-community"
version = "git#v4.15.0"
